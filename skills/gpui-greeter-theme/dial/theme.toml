# Dial: a clock in a ring of sixty ticks, one of them lit and moving with
# the seconds. A small example of the theme folder format; reference.md,
# beside this folder, documents every key.
#
# Lengths are pixels of a 3840 by 2160 frame, 1.5 to a point, sized as
# macOS sizes its lock screen: text at 12 points (18), the field's at 13
# (19.5), the clock's figures 122 points tall (183). Colours are #rrggbb or
# #rrggbbaa.

format = 1
name = "Dial"
description = "A clock in a ring of ticks, the form beneath it."
background = "#14110f"
# The greeter starts at rest, showing the clock alone; the first key or
# click brings the form, and a minute without input takes it away again.
rest = true
rest_after = 60
fonts = ["fonts/NotoSerifDisplay-Light.ttf"]

# What every text inherits unless a layer sets its own.
[text]
font = "Inter"
size = 18
weight = 500
color = "#a8917c"
tracking = 4

[strings.en]
date = "{date:%A, %-d %B}"
wrong = "Wrong password"
confirm = "Press {armed.key} again"
up = "up"
sleep = "Sleep"
restart = "Restart"
shut_down = "Shut down"

[strings.zh-CN]
date = "{date:%-m月%-d日 %A}"
wrong = "密码不对"
confirm = "再按一次 {armed.key}"
up = "已运行"
sleep = "睡眠"
restart = "重启"
shut_down = "关机"

# The glow and the grain, drawn once per monitor size and kept on disk.
[[layer]]
id = "ground"
kind = "svg"
file = "art/ground.svg"
anchor = "fill"
fit = "cover"
monitors = "all"

# The ring of ticks: an SVG of one colour, which states can change and
# motions can turn. It knocks when a password is refused.
[[layer]]
id = "ticks"
kind = "svg"
file = "art/ticks.svg"
tint = true
anchor = "center"
y = -96
width = 992
color = "#4a3d33"
transition = 300

[layer.on.error]
color = "#7a3424"
motion = { property = "rotate", keyframes = [[0, 0], [0.15, -2.5], [0.35, 2], [0.55, -1.2], [0.75, 0.6], [1, 0]], duration = 500, easing = "cubic-bezier(.36, .07, .19, .97)" }

# The lit tick goes round once a minute, a tick at a time, by the clock;
# while the password is checked it races.
[[layer]]
id = "hand"
kind = "svg"
file = "art/hand.svg"
tint = true
anchor = "center"
y = -96
width = 992
color = "#e8a33d"
motion = { property = "rotate", from = 0, to = 360, duration = 60000, easing = "steps(60)", repeat = "infinite", sync = "clock" }

[layer.on.checking]
motion = { property = "rotate", from = 0, to = 360, duration = 900, easing = "steps(60)", repeat = "infinite" }

[layer.on.error]
color = "#e8d5c0"

# The clock and the date, in the middle of the ring.
[[layer]]
id = "clock"
layout = "column"
align = "center"
gap = 4.8
anchor = "center"
y = -120
transition = { duration = 500, easing = "ease-out" }

[layer.on.rest]
scale = 1.12

[[layer]]
parent = "clock"
kind = "text"
text = "{time}"
font = "Noto Serif Display"
weight = 300
size = 255
tracking = -3.1
color = "#ece4d8"
features = ["lnum", "tnum"]

[[layer]]
parent = "clock"
kind = "text"
text = "{t.date}"
case = "upper"

[layer.on.zh-CN]
tracking = 3.2

# What the machine is, in the top left corner.
[[layer]]
id = "facts"
layout = "column"
gap = 7.2
anchor = "top-left"
x = 104
y = 96
size = 18
weight = 400
tracking = 1.8
color = "#7d6c5d"

[[layer]]
parent = "facts"
kind = "text"
text = "{user}@{host}"

[[layer]]
parent = "facts"
kind = "text"
text = "{os} · {kernel}"

[[layer]]
parent = "facts"
kind = "text"
text = "{t.up} {uptime}"

# The form under the ring, hidden at rest.
[[layer]]
id = "form"
layout = "column"
align = "center"
gap = 18
anchor = "center"
y = 500
transition = { duration = 300, easing = "ease" }

[layer.on.rest]
visible = false

# The name and the field on one line, as wide as macOS's field and the
# name, and as tall as macOS's field: 28 points, 42 frame pixels.
[[layer]]
id = "line"
parent = "form"
layout = "row"
align = "center"
gap = 18
width = 336
height = 42
padding = [0, 2.4, 0, 2.4]
border = [0, 0, 1.5, 0]
border_color = "#e8d5c047"
transition = 200

[layer.on."typing, checking"]
border_color = "#e8a33d"

[layer.on.error]
border_color = "#e5703b"
motion = { property = "x", keyframes = [[0, 0], [0.2, -8], [0.4, 14], [0.6, -14], [0.8, 8], [1, 0]], duration = 450, easing = "cubic-bezier(.36, .07, .19, .97)" }

[[layer]]
parent = "line"
kind = "text"
text = "{user}"
case = "upper"

[[layer]]
parent = "line"
kind = "field"
grow = 1
size = 19.5
weight = 400
tracking = 4
color = "#ece4d8"
caret_color = "#e8a33d"
caret_width = 2.4

# One line of status under the field, quiet until there is something to
# say, as on macOS: what PAM says, the check, a refused password.
[[layer]]
parent = "form"
kind = "text"
text = "{message}"
case = "upper"
color = "#7d6c5d"

[layer.on.checking]
text = "{t.checking}"
motion = { property = "opacity", keyframes = [[0, 1], [0.5, 0.35], [1, 1]], duration = 1000, easing = "ease-in-out", repeat = "infinite" }

[layer.on.error]
text = "{t.wrong}"
color = "#e5703b"

[layer.on.zh-CN]
tracking = 2.4

# The session, bottom left: a click or Tab picks the next one.
[[layer]]
id = "session"
layout = "row"
align = "center"
gap = 12
anchor = "bottom-left"
x = 104
y = -96
action = "next-session"
color = "#a8917c"

# On the lock screen the session is the one running, not a choice.
[layer.on.locked]
visible = false

[layer.on.hover]
color = "#ece4d8"

[[layer]]
parent = "session"
kind = "text"
text = "{session}"
case = "upper"

[[layer]]
parent = "session"
kind = "svg"
file = "art/chevron.svg"
tint = true
width = 14

# Sleep, restart and shut down, bottom right. The first press arms an
# action; a second within four seconds runs it.
[[layer]]
id = "power"
layout = "row"
gap = 36
anchor = "bottom-right"
x = -104
y = -96
color = "#a8917c"

[[layer]]
id = "sleep"
parent = "power"
layout = "row"
gap = 9
action = "suspend"

[layer.on.hover]
color = "#ece4d8"

[layer.on.armed]
color = "#e8a33d"

[[layer]]
parent = "sleep"
kind = "text"
text = "F10"
color = "#7d6c5d"

[[layer]]
parent = "sleep"
kind = "text"
text = "{t.sleep}"
case = "upper"

[[layer]]
id = "restart"
parent = "power"
layout = "row"
gap = 9
action = "reboot"

[layer.on.hover]
color = "#ece4d8"

[layer.on.armed]
color = "#e8a33d"

[[layer]]
parent = "restart"
kind = "text"
text = "F11"
color = "#7d6c5d"

[[layer]]
parent = "restart"
kind = "text"
text = "{t.restart}"
case = "upper"

[[layer]]
id = "shut-down"
parent = "power"
layout = "row"
gap = 9
action = "poweroff"

[layer.on.hover]
color = "#ece4d8"

[layer.on.armed]
color = "#e8a33d"

[[layer]]
parent = "shut-down"
kind = "text"
text = "F12"
color = "#7d6c5d"

[[layer]]
parent = "shut-down"
kind = "text"
text = "{t.shut_down}"
case = "upper"

# Above the power actions while one waits for its second press.
[[layer]]
kind = "text"
text = "{t.confirm}"
case = "upper"
color = "#e8a33d"
anchor = "bottom-right"
x = -104
y = -160
visible = false

[layer.on.armed]
visible = true
