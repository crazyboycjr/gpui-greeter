# The greeter user's home: the X cookie, Xorg's log and the last login.
d /var/lib/gpui-greeter 0750 greeter greeter -
# Bing's pictures of the day, which the greeter's user fetches and everyone
# may read: the lock screen and the settings window show them.
d /usr/local/share/gpui-greeter/bing4k 0755 greeter greeter -
