# gpui-greeter's settings, installed as /etc/gpui-greeter/config.toml.
# Every key may be left out; these are the defaults.

# "paper", "paper-night", "frost" or "neon", or the name of a theme folder in
# [themes] dir, which `gpui-greeter install-theme` puts there.
theme = "paper"

# "en" or "zh-CN".
language = "en"

# What every look's sizes are multiplied by, from 0.5 to 1.5: more for a
# larger login screen, less for a denser one. At 1 the looks are laid out
# in points, as a Mac lays out a display as dense as the monitor; theme
# folders take it on top of their own scale.
scale = 1.0

[paper]
# The caret and the session menu's mark. The mockup offered
# "#B0612E", "#3E6E8E", "#5B7F4F" and "#8A5BA6".
accent = "#B0612E"
# What lies under the clock: "desk" (a sheet of paper on a wooden desk),
# "ledger" (blue rules and a red margin), "drafting" (a drafting sheet whose
# title block holds the session and the power actions) or "plain".
background = "desk"

[frost]
# How much the wallpaper blurs (in the mockup's pixels, 8 to 48) and darkens
# (0 to 0.6) behind the login form.
blur = 30
dim = 0.28
# Seconds without a key or a click before the form gives way to the clock.
idle_seconds = 60

[neon]
# The mockup offered "#45F0FF", "#9CFF5A", "#FFB547" and "#FF4FD8".
accent = "#45F0FF"
scanlines = true
# What lies behind the terminal: "skyline" (a city at night), "circuit" (a
# circuit board with running pulses), "horizon" (a synthwave sunset over a
# moving grid floor) or "grid".
background = "skyline"

[wallpaper]
# Frost's pictures: `gpui-greeter sync-wallpapers` copies them here.
dir = "/usr/local/share/gpui-greeter/wallpapers"
# "random" (each start), "daily", "bing" (Bing's picture of the day, a
# random one until it has been fetched) or the name of a file in dir.
pick = "random"
# Where "bing" finds the picture of the day: Bing's archive, whose answer
# names the picture, or any address that answers with a picture itself.
bing_url = "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1"

[sessions]
dir = "/usr/share/xsessions"
# What runs a session's command. startx brings the user's own ~/.xserverrc
# and X setup along, as on a console.
wrapper = "startx /usr/bin/env"

[themes]
# Theme folders, one per theme. A folder theme that cannot be loaded gives
# way to Paper, and the log says why.
dir = "/usr/local/share/gpui-greeter/themes"
# What F9 (and Shift+F9 back) switches between at the login screen, in
# order, such as ["paper", "frost", "console"]. Empty offers every built-in
# look and then every theme folder by name. The greeter remembers the
# choice until `theme` above changes.
cycle = []
