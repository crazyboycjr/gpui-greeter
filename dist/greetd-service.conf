# Installed as /usr/lib/systemd/system/greetd.service.d/gpui-greeter.conf:
# greetd runs gpui-greeter with the settings in /etc/greetd/gpui-greeter.toml,
# and its own /etc/greetd/config.toml stays as the greetd package left it.
[Service]
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/greetd/gpui-greeter.toml
