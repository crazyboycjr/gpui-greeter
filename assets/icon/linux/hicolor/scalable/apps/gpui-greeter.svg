<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>gpui-greeter</title>
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345a"/>
      <stop offset=".55" stop-color="#3a3f5c"/>
      <stop offset="1" stop-color="#15222b"/>
    </linearGradient>
    <filter id="frost" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="62"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6ea" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#fff6ea" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff6ea" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sky)"/>
    <g filter="url(#frost)">
      <ellipse cx="300" cy="230" rx="330" ry="170" fill="#4a6fa5"/>
      <ellipse cx="760" cy="260" rx="260" ry="150" fill="#5b5d8a"/>
      <ellipse cx="560" cy="500" rx="400" ry="150" fill="#f0a24a"/>
      <ellipse cx="300" cy="560" rx="230" ry="120" fill="#c8643f"/>
      <ellipse cx="800" cy="600" rx="200" ry="110" fill="#d77d45"/>
      <ellipse cx="480" cy="820" rx="420" ry="170" fill="#1b4a55"/>
      <ellipse cx="850" cy="860" rx="200" ry="120" fill="#10303b"/>
    </g>
    <rect x="64" y="64" width="896" height="896" fill="#140a0e" opacity=".16"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="512" cy="400" r="128" fill="url(#disc)"/>
    <circle cx="512" cy="400" r="126" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="4"/>
    <rect x="286.0" y="604" width="452" height="104" rx="52.0" fill="url(#glass)"/>
    <rect x="287.5" y="605.5" width="449" height="101" rx="50.5" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="3"/>
  </g>
  <circle cx="412" cy="656.0" r="15" fill="#ffffff"/><circle cx="462" cy="656.0" r="15" fill="#ffffff"/><circle cx="512" cy="656.0" r="15" fill="#ffffff"/><circle cx="562" cy="656.0" r="15" fill="#ffffff"/><circle cx="612" cy="656.0" r="15" fill="#ffffff"/>
  <rect x="71" y="71" width="882" height="882" rx="193" fill="none" stroke="url(#edge)" stroke-width="14" opacity="1.00"/>
</svg>
